<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(79, 172, 254, 0.8),
                             0 0 40px rgba(79, 172, 254, 0.5),
                             0 0 60px rgba(79, 172, 254, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(79, 172, 254, 1),
                             0 0 60px rgba(79, 172, 254, 0.7),
                             0 0 90px rgba(79, 172, 254, 0.5);
            }
        }

        #text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #00f2fe;
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease-out;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }

        #result {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            animation: fadeInUp 1s ease-out 0.3s backwards, glow 2s ease-in-out infinite;
            background: linear-gradient(90deg, #00f2fe, #4facfe, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            #text {
                font-size: 1.2rem;
                margin-bottom: 20px;
            }
            
            #result {
                font-size: 2.5rem;
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            #text {
                font-size: 1rem;
                margin-bottom: 15px;
                letter-spacing: 0.5px;
            }
            
            #result {
                font-size: 2rem;
                padding: 12px;
                letter-spacing: 1px;
            }
        }

        @media (min-width: 1200px) {
            #text {
                font-size: 2rem;
                margin-bottom: 40px;
            }
            
            #result {
                font-size: 4.5rem;
            }
        }
    </style>
</head>

<body>
    <p id="text">Welcome to the Future</p>
    <h1 id="result">Your Result Here</h1>
    <script src="app.js"></script>
</body>

</html>
